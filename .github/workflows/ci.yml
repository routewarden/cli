name: CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - 'README.md'
      - 'VERSIONING.md'
      - 'LICENSE'
  workflow_dispatch:

# Prevents redundant builds: cancel previous runs on the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    name: Go 1.25.1 Test & Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.25.1
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache: true

      - name: Run Go Tests with Race Detection
        run: go test -v -race ./...

      - name: Run Coverage Check
        run: |
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Build CLI Binary
        run: go build -v -o rwarden .

      - name: Smoke Test CLI Execution
        run: |
          ./rwarden version
          ./rwarden schema > /dev/null
          ./rwarden test --path "/.env"
          ./rwarden test --path "/public/index.html"
          ./rwarden dashboard export ./obs-smoke-test
          rm -rf ./obs-smoke-test

  docker-build-test:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ghcr.io/routewarden/cli:test

  ci-success:
    name: CI Status Check
    needs: [test-go, docker-build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Publish CI Results Summary
        run: |
          echo "## 🛡️ RouteWarden CLI CI Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Go Tests & Race Detector** | ✅ Passed | Ran with `-race` on Go 1.25.1 |" >> $GITHUB_STEP_SUMMARY
          echo "| **CLI Build & Smoke Tests** | ✅ Passed | Built and verified commands |" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Build** | ✅ Passed | Verified Go container |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Ready for merge! All checks passed.**" >> $GITHUB_STEP_SUMMARY
