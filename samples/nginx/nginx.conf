# OpenResty / NGINX Configuration with resty.routewarden Lua Plugin
# Test with:
#   rwarden sandbox --config nginx.conf --test
#   rwarden sandbox --config nginx.conf --print-config --dry-run

worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    lua_package_path "/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/site/lualib/?/init.lua;;/etc/nginx/lua/lib/?.lua;";

    init_by_lua_block {
        local routewarden = require("resty.routewarden")
        local config = {
            enabled = true,
            enable_default_patterns = true,
            enable_default_allow_patterns = true,
            path_patterns = {
                "(?i)^/admin/secret.*$",
                "(?i)^/internal/.*$"
            },
            allow_patterns = {
                "(?i)^/internal/healthz$"
            },
            allowed_ips = {
                "192.168.100.50",
                "10.99.0.0/16"
            },
            methods = { "GET", "POST" },
            check_query = true,
            check_headers = { "X-Forwarded-Uri", "X-Rewrite-URL" },
            response = {
                mode = "json",
                status_code = 403,
                headers = {
                    ["X-Security-Warden"] = "Nginx-Active"
                },
                body = "{\"error\":\"Forbidden by RouteWarden NGINX\",\"gateway\":\"nginx\"}"
            }
        }
        warden_instance = routewarden.new(config)
    }

    server {
        listen 8080;

        location / {
            access_by_lua_block {
                warden_instance:check()
            }
            content_by_lua_block {
                ngx.header["Content-Type"] = "text/plain"
                ngx.say("OK: Upstream Reached (NGINX Sandbox)")
            }
        }
    }
}
