# ==============================================================================
# Docker Compose: TCP Warden L4 Firewall with RouteWarden Logging
# ==============================================================================
# Run TCP Warden with RouteWarden security logging enabled:
#
#   docker compose up -d
#
# Launch the RouteWarden Security Observability Stack (Grafana + Loki + Alloy):
#
#   rwarden dashboard
#
# Access Grafana dashboard at:
#   http://localhost:3000
# ==============================================================================

services:
  tcp-warden:
    image: ghcr.io/routewarden/tcp-warden:latest
    container_name: rwarden-tcp-warden
    labels:
      - "routewarden.logs=true"
    ports:
      - "2222:2222"   # SSH Bastion
      - "5432:5432"   # PostgreSQL Bastion
      - "9091:9091"   # Management API
    volumes:
      - ./tcp-warden.yaml:/etc/routewarden/tcp-warden.yaml:ro
      - tcp-warden-data:/var/lib/routewarden
    restart: unless-stopped

volumes:
  tcp-warden-data:
