# TCP Warden CrowdSec Parser
# Ingests JSON log lines produced by tcp-warden
name: routewarden/tcp-warden-logs
description: "Parse TCP Warden L4 security proxy events"
filter: "evt.Line.Labels.type == 'routewarden-tcp-warden'"
onsuccess: next_stage
nodes:
  - filter: "true"
    grok:
      pattern: '^%{GREEDYDATA:json_payload}$'
      apply_on: Line.Raw
    statics:
      - meta: log_type
        value: tcp_warden_event
  - filter: "evt.Parsed.json_payload != ''"
    json:
      target: evt.Parsed
      apply_on: json_payload
    statics:
      - meta: source_ip
        expression: "evt.Parsed.client_ip"
      - meta: service
        expression: "evt.Parsed.service"
      - meta: protocol
        expression: "evt.Parsed.protocol"
      - meta: action
        expression: "evt.Parsed.action"
      - meta: reason
        expression: "evt.Parsed.reason"
      - meta: country
        expression: "evt.Parsed.country_code"
