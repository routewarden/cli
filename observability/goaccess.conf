# RouteWarden — GoAccess Security Dashboard Configuration
# Lightweight real-time threat intelligence and traffic dashboard

# Log format: standard Apache/Nginx COMBINED format
log-format COMBINED
date-format %d/%b/%Y
time-format %H:%M:%S

# Real-time WebSocket streaming
real-time-html true
port 7890
addr 0.0.0.0
ws-url ws://localhost:7890/ws

# Security Dashboard Panel Optimization:
# Suppress noisy/unused panels to keep the console focused, clean, and readable
ignore-panel KEYPHRASES
ignore-panel REFERRING_SITES
ignore-panel REFERRERS
ignore-panel VIRTUAL_HOSTS
ignore-panel REMOTE_USER
ignore-panel CACHE_STATUS
ignore-panel REQUESTS_STATIC

# Sort high-priority threat intelligence panels by hit count
sort-panel REQUESTS,BY_HITS,DESC
sort-panel HOSTS,BY_HITS,DESC
sort-panel STATUS_CODES,BY_HITS,DESC
sort-panel VISITORS,BY_HITS,DESC

# HTML Dashboard Customization
html-report-title RouteWarden — Threat & Security Intelligence
html-refresh 2
html-prefs {"theme":"darkGray","perPage":15,"autoHideTables":true,"showSplines":true}
