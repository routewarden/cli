# RouteWarden — GoAccess Security Dashboard Configuration
# Lightweight real-time threat intelligence and traffic dashboard

# Log format: standard Apache/Nginx COMBINED format
log-format COMBINED
date-format %d/%b/%Y
time-format %H:%M:%S

# Real-time WebSocket streaming
real-time-html true
port 7890
addr 0.0.0.0
ws-url ws://localhost:7890/ws

# High-resolution threat analytics
agent-list false
with-output-resolver true
keep-last 10000

# HTML Dashboard Customization
html-report-title RouteWarden — Threat & Security Intelligence
html-refresh 2
html-prefs {"theme":"darkGray","perPage":25,"autoHideTables":true}
